# Servie à l'application "event-service" uniquement.
ticketflow:
  event:
    catalog:
      default-page-size: 20
      max-page-size: 100
      # Filtres autorisés sur GET /api/v1/events (tout autre paramètre est ignoré, FR-002)
      allowed-filters: text,venue,categoryId,dateFrom,dateTo,minPrice,maxPrice,page,size,sort
    # Limite de capacité d'un événement (anti-abus)
    max-capacity: 100000
