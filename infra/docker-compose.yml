# ============================================================================
# TicketFlow — Stack Docker Compose complète
# Lancement : docker-compose --env-file ../.env up --build
# Arrêt      : docker-compose down
# Reset BDD  : docker-compose down -v
# ============================================================================

name: ticketflow

services:

  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE TRANSVERSE
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: ticketflow-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
      POSTGRES_DB: postgres
    volumes:
      # Le script d'init crée une base de données par service métier
      - ./init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketflow} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: ticketflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: ticketflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listeners : INTERNAL pour le réseau Docker, EXTERNAL pour l'hôte (développement local)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: ticketflow-keycloak
    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false
    ports:
      - "9090:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/postgres
      KC_DB_USERNAME: ${POSTGRES_USER:-ticketflow}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
    volumes:
      # Realm pré-configuré : clients (api-gateway, services), rôles (ROLE_CLIENT, ROLE_ORGANIZER, ROLE_ADMIN)
      - ./init-scripts/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # SERVICES TRANSVERSES (démarrent en premier)
  # ---------------------------------------------------------------------------

  config-server:
    build:
      context: ..
      dockerfile: services/config-server/Dockerfile
    container_name: ticketflow-config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO: file:/config-repo/
    volumes:
      - ../config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8888'"]
      interval: 5s
      timeout: 3s
      retries: 20

  discovery-server:
    build:
      context: ..
      dockerfile: services/discovery-server/Dockerfile
    container_name: ticketflow-discovery-server
    ports:
      - "8761:8761"
    environment:
      EUREKA_HOST: discovery-server
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8761'"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # API GATEWAY
  # ---------------------------------------------------------------------------

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: ticketflow-api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/ticketflow
      CORS_ORIGINS: http://localhost:4200
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ---------------------------------------------------------------------------
  # SERVICES MÉTIER (dépendent de Postgres + Kafka + Keycloak + Eureka + Config)
  # ---------------------------------------------------------------------------

  customer-service:
    build:
      context: ..
      dockerfile: services/customer-service/Dockerfile
    container_name: ticketflow-customer-service
    ports:
      - "8081:8081"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/ticketflow
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  event-service:
    build:
      context: ..
      dockerfile: services/event-service/Dockerfile
    container_name: ticketflow-event-service
    ports:
      - "8082:8082"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/ticketflow
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  booking-service:
    build:
      context: ..
      dockerfile: services/booking-service/Dockerfile
    container_name: ticketflow-booking-service
    ports:
      - "8083:8083"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/ticketflow
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  payment-service:
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    container_name: ticketflow-payment-service
    ports:
      - "8084:8084"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/ticketflow
      PAYMENT_WEBHOOK_SECRET: dev-webhook-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  ticket-service:
    build:
      context: ..
      dockerfile: services/ticket-service/Dockerfile
    container_name: ticketflow-ticket-service
    ports:
      - "8085:8085"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/ticketflow
      TICKET_CODE_SIGNING_KEY: dev-ticket-signing-key-change-me
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: ticketflow-notification-service
    ports:
      - "8086:8086"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/ticketflow
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # SERVICES AGENTIQUES (dépendent des services métier + LLM/Telegram externes)
  # ---------------------------------------------------------------------------

  ai-assistant-service:
    build:
      context: ..
      dockerfile: services/ai-assistant-service/Dockerfile
    container_name: ticketflow-ai-assistant-service
    ports:
      - "8087:8087"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/ticketflow
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-replace_me}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-replace_me}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-replace_me}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-replace_me}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  mcp-tool-server:
    build:
      context: ..
      dockerfile: services/mcp-tool-server/Dockerfile
    container_name: ticketflow-mcp-tool-server
    ports:
      - "8088:8088"
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-replace_me}
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

volumes:
  postgres-data:
    name: ticketflow-postgres-data
