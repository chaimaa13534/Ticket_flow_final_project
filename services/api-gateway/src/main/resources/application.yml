server:
  port: 8080

spring:
  application:
    name: api-gateway

  config:
    # Configuration centralisée. "optional:" permet au gateway de démarrer même si
    # le Config Server est down (il utilise alors sa config locale).
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak expose les clés publiques via le endpoint JWKS.
          # Le gateway récupère la clé, vérifie la signature et les claims du JWT.
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:9090}/realms/ticketflow/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:9090/realms/ticketflow}

  cloud:
    gateway:
      server:
        webflux:
          # ------------------------------------------------------------------------
          # Routes explicites — AUCUNE découverte automatique (CdC §8.1).
          # Une route oubliée est une faille, pas une fonctionnalité.
          #
          # ORDRE DES ROUTES COMPTE : Spring évalue les routes dans l'ordre de
          # déclaration. La plus spécifique doit venir AVANT la plus générique.
          # Ex : /api/v1/me/bookings/** AVANT /api/v1/me/**, sinon la route
          # bookings serait avalée par la route customer.
          #
          # Le filtre CorrelationId est déclaré UNE SEULE FOIS dans default-filters
          # ci-dessous : il s'applique à toutes les routes automatiquement.
          # ------------------------------------------------------------------------
          routes:
            # 1) Booking — routes "mes réservations" (préfixe /me/bookings)
            - id: booking-service-me-bookings
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/me/bookings/**

            # 2) Customer — auth, profil client, /me/* restant (sauf /me/bookings déjà routé)
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/auth/**, /api/v1/customers/**, /api/v1/me/**

            # 3) Event Service — catalogue public et admin d'événements
            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/v1/events/**, /api/v1/venues/**, /api/v1/categories/**

            # 4) Booking Service — opérations sur réservations
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**

            # 5) Payment Service — paiements + webhooks prestataire
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**, /webhooks/payments/**

            # 6) Ticket Service — billets
            - id: ticket-service
              uri: lb://ticket-service
              predicates:
                - Path=/api/v1/tickets/**

            # 7) AI Assistant — webhook Telegram uniquement
            - id: ai-assistant-service
              uri: lb://ai-assistant-service
              predicates:
                - Path=/webhooks/telegram/**

          # ------------------------------------------------------------------------
          # Filtres appliqués à TOUTES les routes (default-filters)
          # Le filtre CorrelationId est injecté par Spring Cloud Gateway via le bean
          # CorrelationIdGatewayFilterFactory (convention de nommage).
          # ------------------------------------------------------------------------
          default-filters:
            - CorrelationId

          # ------------------------------------------------------------------------
          # CORS global — config officielle Spring Cloud Gateway 2025
          # (spring.cloud.gateway.server.webflux.globalcors)
          # ------------------------------------------------------------------------
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
                allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,refresh
  endpoint:
    health:
      show-details: always
