server:
  port: 8888

spring:
  application:
    name: config-server

  profiles:
    # Profil par défaut : backend fichiers locaux (config-repo/ monté en volume).
    # Pour la production : positionner le profil "git" via SPRING_PROFILES_ACTIVE.
    active: native

  cloud:
    config:
      server:
        # --- Backend fichiers locaux (profil native) ---
        native:
          # Le répertoire est monté par docker-compose. En local sans Docker, le chemin
          # par défaut pointe vers ../config-repo/ (relatif au répertoire de travail).
          search-locations: ${CONFIG_REPO:file:../config-repo/}
        # --- Backend Git (profil git) — décommenté en production ---
        # git:
        #   uri: ${CONFIG_GIT_URI}
        #   default-label: ${CONFIG_GIT_LABEL:main}
        #   username: ${CONFIG_GIT_USERNAME:}
        #   password: ${CONFIG_GIT_PASSWORD:}
        #   clone-on-start: true
        #   force-pull: true
        #   refresh-rate: 30

# Healthcheck : /actuator/health renvoie UP quand le serveur est prêt à servir.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
