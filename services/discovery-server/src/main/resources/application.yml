server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: ${EUREKA_HOST:localhost}
  client:
    # Ce serveur EST le registre : il ne doit ni s'enregistrer ni récupérer le registre
    # auprès d'un autre Eureka (sinon : logs "connection refused" au démarrage).
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  server:
    # Délai d'expiration de la "self-preservation" réduit pour le développement local.
    # En production : laisser la valeur par défaut (90s) pour éviter de perdre des instances actives.
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
